name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Optional: with these set (repository secrets pointing at a Neon branch), the RLS
      # integration tests and the cohort/facilitator browser walks run too. Without them they skip.
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.CI_DATABASE_URL_UNPOOLED }}
      NEON_AUTH_BASE_URL: ${{ secrets.CI_NEON_AUTH_BASE_URL }}
      NEON_AUTH_COOKIE_SECRET: ${{ secrets.CI_NEON_AUTH_COOKIE_SECRET }}
      # CI points at its own Neon branch, so the integration tests may write there.
      ALLOW_DB_WRITES: ${{ secrets.CI_DATABASE_URL != '' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Write .env.local for tests that read it
        run: |
          if [ -n "$DATABASE_URL" ]; then
            printf 'DATABASE_URL=%s\nDATABASE_URL_UNPOOLED=%s\nNEON_AUTH_BASE_URL=%s\nNEON_AUTH_COOKIE_SECRET=%s\n' "$DATABASE_URL" "$DATABASE_URL_UNPOOLED" "$NEON_AUTH_BASE_URL" "$NEON_AUTH_COOKIE_SECRET" > .env.local
            npm run db:migrate
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
